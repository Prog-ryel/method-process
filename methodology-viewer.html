<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methodology Viewer — BMI System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js"></script>
    <style>
        :root {
            --teal: #0d9488;
            --teal-dark: #0f766e;
            --slate-900: #0f172a;
            --slate-700: #334155;
            --slate-500: #64748b;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --radius: 12px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: var(--slate-100);
            color: var(--slate-900);
            min-height: 100vh;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid var(--slate-200);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        }
        .topbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--slate-900);
            margin-right: auto;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .tabs {
            display: flex;
            background: var(--slate-100);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
        }
        .tab {
            border: none;
            background: transparent;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--slate-500);
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab:hover { color: var(--slate-900); }
        .tab.active {
            background: #fff;
            color: var(--teal-dark);
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .btn {
            border: none;
            font-family: inherit;
            font-size: 0.8125rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .btn-primary {
            background: var(--teal);
            color: #fff;
        }
        .btn-primary:hover { background: var(--teal-dark); }
        .btn-outline {
            background: #fff;
            color: var(--slate-700);
            border: 1px solid var(--slate-200);
        }
        .btn-outline:hover {
            border-color: var(--teal);
            color: var(--teal-dark);
        }
        .btn-success {
            background: #059669;
            color: #fff;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .status {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            margin-bottom: 16px;
            display: none;
        }
        .status.show { display: flex; align-items: center; gap: 8px; }
        .status.ok { background: #d1fae5; color: #065f46; }
        .status.err { background: #fee2e2; color: #991b1b; }
        .status.info { background: #e0f2fe; color: #075985; }
        .panel {
            display: none;
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--slate-200);
            overflow: hidden;
            min-height: calc(100vh - 140px);
        }
        .panel.active { display: block; }
        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--slate-200);
            background: var(--slate-50);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .panel-header span {
            font-size: 0.8125rem;
            color: var(--slate-500);
            font-weight: 500;
        }
        #markdownSource {
            width: 100%;
            min-height: calc(100vh - 200px);
            border: none;
            padding: 20px 24px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            background: #fafbfc;
            color: var(--slate-900);
        }
        #previewContent {
            padding: 32px 40px 48px;
            max-width: 900px;
            line-height: 1.7;
        }
        #previewContent h1 { font-size: 1.75rem; margin-top: 0; border-bottom: 2px solid var(--teal); padding-bottom: 8px; }
        #previewContent h2 { font-size: 1.35rem; margin-top: 2rem; color: var(--teal-dark); }
        #previewContent h3 { font-size: 1.1rem; margin-top: 1.5rem; }
        #previewContent h4 { font-size: 1rem; }
        #previewContent table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin: 1rem 0;
        }
        #previewContent th, #previewContent td {
            border: 1px solid var(--slate-200);
            padding: 10px 12px;
            text-align: left;
        }
        #previewContent th { background: var(--slate-100); font-weight: 600; }
        #previewContent tr:nth-child(even) { background: var(--slate-50); }
        #previewContent pre {
            background: var(--slate-900);
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85rem;
        }
        #previewContent code {
            background: var(--slate-100);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
        }
        #previewContent pre code { background: none; padding: 0; }
        #previewContent blockquote {
            border-left: 4px solid var(--teal);
            margin: 1rem 0;
            padding: 8px 16px;
            background: var(--slate-50);
            color: var(--slate-700);
        }
        #previewContent hr { border: none; border-top: 1px solid var(--slate-200); margin: 2rem 0; }
        .mermaid-diagram {
            margin: 1.5rem 0;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid var(--slate-200);
            border-radius: var(--radius);
            overflow-x: auto;
        }
        .mermaid-diagram .diagram-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .mermaid-diagram .diagram-title {
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--teal-dark);
        }
        .mermaid-diagram .mermaid,
        .mermaid-diagram svg {
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }
        .mermaid-diagram.mermaid-error {
            background: #fef2f2;
            border-color: #fecaca;
        }
        .mermaid-diagram.mermaid-error pre {
            color: #991b1b;
            font-size: 12px;
            white-space: pre-wrap;
        }
        #diagramsPanel .diagram-card {
            margin-bottom: 28px;
            padding: 24px;
            background: #fff;
            border: 1px solid var(--slate-200);
            border-radius: var(--radius);
        }
        #diagramsPanel .diagram-card h3 {
            margin: 0 0 16px;
            font-size: 1.1rem;
            color: var(--teal-dark);
        }
        .split-hint {
            font-size: 0.75rem;
            color: var(--slate-500);
            padding: 8px 20px;
            background: #fffbeb;
            border-bottom: 1px solid #fde68a;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--slate-900);
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.25s;
            z-index: 200;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        @media (max-width: 768px) {
            #previewContent { padding: 20px 16px; }
            .topbar-inner { flex-direction: column; align-items: stretch; }
            .brand { margin-right: 0; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-file-lines"></i></div>
                <span>Methodology Viewer</span>
            </div>

            <div class="tabs" role="tablist">
                <button type="button" class="tab active" data-panel="preview" id="tabPreview">
                    <i class="fas fa-eye"></i> Preview
                </button>
                <button type="button" class="tab" data-panel="markdown" id="tabMarkdown">
                    <i class="fas fa-code"></i> Markdown
                </button>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="btnRefreshPreview" title="Render markdown as preview">
                    <i class="fas fa-sync-alt"></i> Refresh Preview
                </button>
                <button type="button" class="btn btn-outline" id="btnCopyMarkdown">
                    <i class="fas fa-copy"></i> Copy Markdown
                </button>
                <button type="button" class="btn btn-outline" id="btnCopyPreviewText">
                    <i class="fas fa-paragraph"></i> Copy Preview (Text)
                </button>
                <button type="button" class="btn btn-outline" id="btnCopyPreviewHtml">
                    <i class="fas fa-file-code"></i> Copy Preview (HTML)
                </button>
                <button type="button" class="btn btn-outline" id="btnCopySelection" title="Copy text you selected in Preview">
                    <i class="fas fa-highlighter"></i> Copy Selection
                </button>
                <label class="btn btn-outline" style="cursor:pointer;margin:0;">
                    <i class="fas fa-folder-open"></i> Load .md
                    <input type="file" accept=".md,text/markdown,text/plain" id="fileInput" hidden>
                </label>
            </div>
        </div>
    </header>

    <main class="layout">
        <div id="statusBox" class="status info show">
            <i class="fas fa-spinner fa-spin"></i>
            <span id="statusText">Loading METHODOLOGY.md…</span>
        </div>

        <!-- Preview panel -->
        <section class="panel active" id="panelPreview" aria-label="Preview">
            <div class="panel-header">
                <span>Rendered preview (tables, headings, Mermaid diagrams)</span>
                <button type="button" class="btn btn-outline" id="btnCopyFromPreviewHeader">
                    <i class="fas fa-copy"></i> Copy all preview text
                </button>
            </div>
            <article id="previewContent"></article>
        </section>

        <!-- Diagrams only (4.1–4.3 rendered) -->
        <section class="panel" id="panelDiagrams" aria-label="Mermaid diagrams">
            <div class="panel-header">
                <span>Rendered flowcharts &amp; sequence diagrams (ready to copy)</span>
                <button type="button" class="btn btn-primary" id="btnRefreshDiagrams">
                    <i class="fas fa-sync-alt"></i> Render Diagrams
                </button>
            </div>
            <div id="diagramsPanel" style="padding: 20px 24px 40px;">
                <p style="color:#64748b">Click <strong>Render Diagrams</strong> or open this tab after loading METHODOLOGY.md.</p>
            </div>
        </section>

        <!-- Markdown source panel -->
        <section class="panel" id="panelMarkdown" aria-label="Markdown source">
            <div class="panel-header">
                <span>Raw markdown — edit here, then Refresh Preview</span>
                <button type="button" class="btn btn-outline" id="btnSelectAllMd">
                    <i class="fas fa-check-double"></i> Select all
                </button>
            </div>
            <textarea id="markdownSource" spellcheck="false" placeholder="Markdown will load here…"></textarea>
        </section>
    </main>

    <div class="toast" id="toast">Copied!</div>

    <script>
        const MD_FILE = 'METHODOLOGY.md';
        const markdownSource = document.getElementById('markdownSource');
        const previewContent = document.getElementById('previewContent');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const toast = document.getElementById('toast');

        marked.setOptions({ gfm: true, breaks: true });

        function buildMermaidHtml(code, id, title) {
            const label = title || 'Mermaid diagram';
            return '<div class="mermaid-diagram" data-mermaid-id="' + id + '">' +
                '<div class="diagram-toolbar">' +
                '<span class="diagram-title"><i class="fas fa-chart-network"></i> ' + label + '</span>' +
                '<span class="btn-group" style="gap:6px">' +
                '<button type="button" class="btn btn-outline btn-copy-png" data-target="' + id + '" data-title="' + label.replace(/"/g, '') + '">' +
                '<i class="fas fa-image"></i> Copy PNG</button>' +
                '<button type="button" class="btn btn-outline btn-download-png" data-target="' + id + '" data-title="' + label.replace(/"/g, '') + '">' +
                '<i class="fas fa-download"></i> Download PNG</button></span></div>' +
                '<div class="mermaid">' + code + '</div></div>';
        }

        /** Split markdown so mermaid blocks become HTML before marked runs */
        function parseMarkdownWithMermaid(md) {
            const re = /```mermaid\s*\n([\s\S]*?)```/gi;
            let html = '';
            let lastIndex = 0;
            let match;
            let n = 0;
            while ((match = re.exec(md)) !== null) {
                const chunk = md.slice(lastIndex, match.index);
                if (chunk.trim()) html += marked.parse(chunk);
                const before = md.slice(0, match.index);
                const headingMatch = before.match(/###\s+(.+?)\s*$/m);
                const title = headingMatch ? headingMatch[1].trim() : 'Diagram ' + (n + 1);
                const id = 'mmd-preview-' + (n++);
                html += buildMermaidHtml(match[1].trim(), id, title);
                lastIndex = match.index + match[0].length;
            }
            const tail = md.slice(lastIndex);
            if (tail.trim()) html += marked.parse(tail);
            return html || marked.parse(md);
        }

        mermaid.initialize({
            startOnLoad: false,
            theme: 'base',
            themeVariables: {
                primaryColor: '#ccfbf1',
                primaryTextColor: '#0f172a',
                primaryBorderColor: '#0d9488',
                lineColor: '#334155',
                secondaryColor: '#f1f5f9',
                tertiaryColor: '#fff'
            },
            securityLevel: 'loose',
            flowchart: { useMaxWidth: true, htmlLabels: false },
            sequence: { useMaxWidth: true, wrap: true }
        });

        function showStatus(message, type) {
            statusBox.className = 'status show ' + (type || 'info');
            statusText.textContent = message;
        }

        function hideStatus() {
            statusBox.classList.remove('show');
        }

        function showToast(msg) {
            toast.textContent = msg || 'Copied to clipboard!';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        async function copyToClipboard(text) {
            if (!text) {
                showToast('Nothing to copy');
                return false;
            }
            try {
                await navigator.clipboard.writeText(text);
                showToast('Copied to clipboard!');
                return true;
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Copied to clipboard!');
                return true;
            }
        }

        function getMarkdown() {
            return markdownSource.value;
        }

        const PANEL_IDS = { preview: 'panelPreview', diagrams: 'panelDiagrams', markdown: 'panelMarkdown' };

        function switchPanel(name) {
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.panel === name);
            });
            Object.keys(PANEL_IDS).forEach(key => {
                document.getElementById(PANEL_IDS[key]).classList.toggle('active', key === name);
            });
        }

        function extractMermaidBlocks(md) {
            const re = /```mermaid\s*\n([\s\S]*?)```/gi;
            const blocks = [];
            let m;
            let i = 0;
            while ((m = re.exec(md)) !== null) {
                const before = md.slice(0, m.index);
                const headingMatch = before.match(/###\s+(.+?)\s*$/m);
                const title = headingMatch ? headingMatch[1].trim() : 'Diagram ' + (++i);
                blocks.push({ title, code: m[1].trim() });
            }
            return blocks;
        }

        async function runMermaidOn(container) {
            const blocks = container.querySelectorAll('.mermaid-diagram .mermaid');
            if (!blocks.length) return 0;

            blocks.forEach((el) => {
                el.removeAttribute('data-processed');
                if (!el.querySelector('svg')) {
                    el.textContent = el.textContent.trim();
                }
            });

            const toRender = Array.from(blocks).filter(el => !el.querySelector('svg'));
            if (!toRender.length) return blocks.length;

            try {
                await mermaid.run({ nodes: toRender, suppressErrors: false });
                return blocks.length;
            } catch (err) {
                console.error('Mermaid:', err);
                blocks.forEach(el => {
                    const wrap = el.closest('.mermaid-diagram') || el.parentElement;
                    if (wrap) {
                        wrap.classList.add('mermaid-error');
                        const msg = document.createElement('p');
                        msg.style.cssText = 'color:#991b1b;font-size:13px;margin-top:8px';
                        msg.textContent = 'Diagram error: ' + (err.message || err);
                        wrap.appendChild(msg);
                    }
                });
                return 0;
            }
        }

        function findDiagramWrap(targetId) {
            return document.querySelector('.mermaid-diagram[data-mermaid-id="' + targetId + '"]');
        }

        function getSvgFromDiagram(targetId) {
            const wrap = findDiagramWrap(targetId);
            if (!wrap) return null;
            const svg = wrap.querySelector('svg');
            return svg ? { svg, wrap } : null;
        }

        function getSvgDimensions(svg) {
            const viewBox = svg.getAttribute('viewBox');
            if (viewBox) {
                const p = viewBox.trim().split(/[\s,]+/).map(Number);
                if (p.length >= 4 && p[2] > 0 && p[3] > 0) {
                    return { w: Math.ceil(p[2]), h: Math.ceil(p[3]) };
                }
            }
            const rect = svg.getBoundingClientRect();
            const w = parseFloat(svg.getAttribute('width')) || rect.width;
            const h = parseFloat(svg.getAttribute('height')) || rect.height;
            return {
                w: Math.max(Math.ceil(w), 200),
                h: Math.max(Math.ceil(h), 120)
            };
        }

        function prepareSvgClone(svg) {
            const clone = svg.cloneNode(true);
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
            clone.querySelectorAll('foreignObject').forEach((el) => el.remove());
            const { w, h } = getSvgDimensions(svg);
            clone.setAttribute('width', String(w));
            clone.setAttribute('height', String(h));
            if (!clone.getAttribute('viewBox')) {
                clone.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
            }
            return { clone, w, h };
        }

        function svgToPngBlob(svg, scale) {
            scale = scale || 2;
            const { clone, w, h } = prepareSvgClone(svg);
            const svgString = new XMLSerializer().serializeToString(clone);
            const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.ceil(w * scale);
                    canvas.height = Math.ceil(h * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => {
                        if (blob) resolve({ blob, canvas, w, h });
                        else reject(new Error('PNG conversion failed'));
                    }, 'image/png', 1);
                };
                img.onerror = () => reject(new Error('Could not load SVG as image'));
                img.src = dataUrl;
            });
        }

        function safeFilename(title) {
            return (title || 'diagram').replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').slice(0, 60) || 'diagram';
        }

        async function exportDiagramPng(targetId, title, mode) {
            const found = getSvgFromDiagram(targetId);
            if (!found) {
                showToast('Click Refresh Preview / Render Diagrams first');
                return;
            }

            try {
                const { blob, canvas } = await svgToPngBlob(found.svg, 2);
                const filename = safeFilename(title) + '.png';

                if (mode === 'download') {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(a.href);
                    showToast('Downloaded: ' + filename);
                    return;
                }

                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    showToast('PNG copied — paste in Word or PowerPoint');
                } catch (clipErr) {
                    const a = document.createElement('a');
                    a.href = canvas.toDataURL('image/png');
                    a.download = filename;
                    a.click();
                    showToast('Clipboard blocked — PNG downloaded instead');
                }
            } catch (e) {
                console.error(e);
                showToast('Export failed: ' + (e.message || e));
            }
        }

        async function copyDiagramPng(targetId, title) {
            await exportDiagramPng(targetId, title, 'copy');
        }

        document.addEventListener('click', (e) => {
            const copyBtn = e.target.closest('.btn-copy-png');
            if (copyBtn) {
                e.preventDefault();
                copyDiagramPng(copyBtn.dataset.target, copyBtn.dataset.title);
                return;
            }
            const dlBtn = e.target.closest('.btn-download-png');
            if (dlBtn) {
                e.preventDefault();
                exportDiagramPng(dlBtn.dataset.target, dlBtn.dataset.title, 'download');
            }
        });

        async function renderDiagramsPanel() {
            const panel = document.getElementById('diagramsPanel');
            const md = getMarkdown();
            const blocks = extractMermaidBlocks(md);

            if (!blocks.length) {
                panel.innerHTML = '<p style="color:#64748b">No <code>```mermaid</code> blocks found in METHODOLOGY.md.</p>';
                return;
            }

            panel.innerHTML = blocks.map((b, i) => {
                const id = 'diagram-card-' + i;
                const t = b.title.replace(/"/g, '');
                return '<div class="diagram-card">' +
                    '<h3>' + b.title + '</h3>' +
                    buildMermaidHtml(b.code, id, b.title) + '</div>';
            }).join('');

            const count = await runMermaidOn(panel);
            showToast(count ? count + ' diagram(s) rendered' : 'Check diagram errors');
        }

        async function renderPreview() {
            const md = getMarkdown();
            if (!md.trim()) {
                previewContent.innerHTML = '<p style="color:#64748b">No markdown content. Load METHODOLOGY.md or paste content in the Markdown tab.</p>';
                return;
            }

            previewContent.innerHTML = parseMarkdownWithMermaid(md);
            await runMermaidOn(previewContent);
        }

        async function loadMarkdownFromUrl() {
            try {
                const res = await fetch(MD_FILE + '?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                markdownSource.value = text;
                showStatus('Loaded ' + MD_FILE + ' — click Preview tab or Refresh Preview', 'ok');
                await renderPreview();
                setTimeout(hideStatus, 4000);
                return true;
            } catch (err) {
                showStatus(
                    'Could not load ' + MD_FILE + ' automatically. Open via http://localhost/BMI%20SYSTEM/methodology-viewer.html or use Load .md button. (' + err.message + ')',
                    'err'
                );
                markdownSource.placeholder = 'Paste markdown here, or use "Load .md" to open METHODOLOGY.md';
                return false;
            }
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', async () => {
                switchPanel(tab.dataset.panel);
                if (tab.dataset.panel === 'preview') await renderPreview();
                if (tab.dataset.panel === 'diagrams') await renderDiagramsPanel();
            });
        });

        document.getElementById('btnRefreshPreview').addEventListener('click', async () => {
            await renderPreview();
            await renderDiagramsPanel();
            switchPanel('preview');
            showToast('Preview & diagrams updated');
        });

        document.getElementById('btnRefreshDiagrams').addEventListener('click', async () => {
            await renderDiagramsPanel();
            showToast('Diagrams rendered');
        });

        document.getElementById('btnCopyMarkdown').addEventListener('click', () => {
            copyToClipboard(getMarkdown());
        });

        document.getElementById('btnCopyPreviewText').addEventListener('click', () => {
            copyToClipboard(previewContent.innerText);
        });

        document.getElementById('btnCopyPreviewHtml').addEventListener('click', () => {
            copyToClipboard(previewContent.innerHTML);
        });

        document.getElementById('btnCopyFromPreviewHeader').addEventListener('click', () => {
            copyToClipboard(previewContent.innerText);
        });

        document.getElementById('btnCopySelection').addEventListener('click', () => {
            const sel = window.getSelection().toString();
            if (sel.trim()) copyToClipboard(sel);
            else showToast('Select text in Preview first');
        });

        document.getElementById('btnSelectAllMd').addEventListener('click', () => {
            markdownSource.focus();
            markdownSource.select();
        });

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();
            markdownSource.value = text;
            showStatus('Loaded: ' + file.name, 'ok');
            await renderPreview();
            switchPanel('preview');
            setTimeout(hideStatus, 3000);
            e.target.value = '';
        });

        markdownSource.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                renderPreview();
                showToast('Preview refreshed (Ctrl+S)');
            }
        });

        loadMarkdownFromUrl();
    </script>
</body>
</html>
